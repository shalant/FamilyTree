<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArborKin — Organic Curve Variations</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0C0B09;
    color: #D4CFC5;
    font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    min-height: 100vh;
    padding: 56px 32px 88px;
  }

  header { text-align: center; margin-bottom: 52px; }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .brand-name {
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #5B8C5B;
  }

  h1 {
    font-size: clamp(1.7rem, 4.5vw, 2.9rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: #EDE8DE;
  }
  h1 em { font-style: italic; color: #87B87A; }

  .meta {
    margin-top: 10px;
    font-size: 0.72rem;
    color: #3E3B35;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .hairline {
    width: 64px; height: 1px;
    background: linear-gradient(90deg, transparent, #2D4828, transparent);
    margin: 18px auto 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1160px;
    margin: 0 auto;
  }
  @media (max-width: 860px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  @media (min-width: 861px) { .card:nth-child(5) { grid-column: 2; } }

  .card {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.015);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    cursor: default;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }

  .card-header {
    padding: 14px 17px 11px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    background: rgba(0,0,0,0.2);
  }
  .card-num {
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8B6347;
    margin-bottom: 3px;
  }
  .card-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: #EDE8DE;
    letter-spacing: 0.01em;
  }
  .card-desc {
    font-size: 0.68rem;
    font-style: italic;
    color: #524E47;
    margin-top: 4px;
    line-height: 1.5;
  }
  .card-change {
    margin-top: 6px;
    font-size: 0.6rem;
    font-family: 'Courier New', monospace;
    color: #8B6347;
    letter-spacing: 0.04em;
    line-height: 1.6;
  }

  .preview { line-height: 0; overflow: hidden; }
  .preview svg { display: block; width: 100%; height: auto; }

  .swatches { display: flex; height: 28px; border-top: 1px solid rgba(255,255,255,0.05); }
  .sw {
    flex: 1; position: relative;
    transition: flex 0.18s ease; overflow: hidden;
  }
  .sw:hover { flex: 1.7; }
  .sw .tip {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s;
    pointer-events: none; gap: 1px;
  }
  .sw:hover .tip { opacity: 1; }
  .sw .tip span {
    font-size: 6px; font-family: 'Courier New', monospace;
    mix-blend-mode: difference; color: white; letter-spacing: 0.04em;
  }

  .footnote {
    text-align: center; margin-top: 52px;
    font-size: 0.68rem; color: #2A2822;
    font-style: italic; letter-spacing: 0.06em; line-height: 1.8;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <path d="M11 3v16M11 7.5 L7 12M11 7.5 L15 12M11 12 L8.5 15.5M11 12 L13.5 15.5"
            stroke="#5B8C5B" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">ArborKin</span>
  </div>
  <h1>Organic Curves <em>+ Warmth</em></h1>
  <p class="meta">Curved connectors · Ground Tone canvas direction · June 2026</p>
  <div class="hairline"></div>
</header>

<main class="grid" id="grid"></main>

<p class="footnote">
  All five use bezier curves rather than orthogonal lines — a step toward the organic branch feel.<br>
  Canvas warms progressively from left-to-right, top-to-bottom.<br>
  Hover swatches for hex values.
</p>

<script>
// ── Canvas gradient spectrum: Ground Tone → Golden Canopy ─────────────────
// ct = canvas top  (stays near #f0faf4 throughout, barely changes)
// cb = canvas bottom (shifts from blue-green → yellow-green → golden)
// wr = warm radial color (brown bloom at bottom, increases in intensity)
// wi = warm radial opacity

const CARDS = [
  {
    name: 'Curve + Ground',
    num: 'Variation 01',
    desc: 'Bezier curves replace orthogonal lines on the Ground Tone canvas. Connectors stay current green — only the shape changes.',
    change: 'connectors: orthogonal → bezier\ncanvas bottom: #aee5c4 → #bcd8a4',
    ct: '#f0faf4', cb: '#bcd8a4', wr: '#8B5A2B', wi: 0.07,
    nf: '#ffffff', ns: '#9AB8AF',
    ff: '#d6f2e0', fb: '#2e9966', ft: '#15623d',
    nt: '#444441', st: '#B8C4BE',
    pl: '#B5C5BB',   // parent curves — light gray-green (same tone, curved)
    cl: '#4db282',   // couple arcs — current green
    ax: '#C0CECA',
    swatches: [
      { c: '#f0faf4', l: 'canvas top' },
      { c: '#bcd8a4', l: 'canvas btm' },
      { c: '#B5C5BB', l: 'branch' },
      { c: '#4db282', l: 'couple' },
    ]
  },
  {
    name: 'Warm Branch',
    num: 'Variation 02',
    desc: 'Parent curves shift to warm taupe while couple arcs stay green. Brown tree branches on a warming canvas.',
    change: 'parent curves: #B5C5BB → #B09870\ncanvas bottom: #bcd8a4',
    ct: '#f0faf4', cb: '#bcd8a4', wr: '#8B5A2B', wi: 0.08,
    nf: '#ffffff', ns: '#9AB8AF',
    ff: '#d6f2e0', fb: '#2e9966', ft: '#15623d',
    nt: '#444441', st: '#B8C4BE',
    pl: '#B09870',   // warm taupe branches
    cl: '#4db282',   // couple stays green
    ax: '#C0CECA',
    swatches: [
      { c: '#f0faf4', l: 'canvas top' },
      { c: '#bcd8a4', l: 'canvas btm' },
      { c: '#B09870', l: 'branch ←' },
      { c: '#4db282', l: 'couple' },
    ]
  },
  {
    name: 'Amber Afternoon',
    num: 'Variation 03',
    desc: 'Canvas warms further toward amber-yellow. Connectors take an olive-brown tone. Feels like late summer.',
    change: 'canvas bottom: #bcd8a4 → #c4d890\nconnectors: olive-brown #A8A060',
    ct: '#f2f8ee', cb: '#c4d890', wr: '#8B6020', wi: 0.10,
    nf: '#ffffff', ns: '#9B9870',  // node rings warm to olive-gray
    ff: '#d6f2e0', fb: '#2e9966', ft: '#15623d',
    nt: '#444441', st: '#ACA880',
    pl: '#A8A060',   // olive-brown curves
    cl: '#5BA870',   // slightly warmer green
    ax: '#BCBA90',
    swatches: [
      { c: '#f2f8ee', l: 'canvas top' },
      { c: '#c4d890', l: 'canvas btm' },
      { c: '#A8A060', l: 'branch ←' },
      { c: '#9B9870', l: 'node ring ←' },
    ]
  },
  {
    name: 'Bark & Vine',
    num: 'Variation 04',
    desc: 'Both connector types warm to brown. Node rings shift to bark. Canvas has a distinct golden undertone.',
    change: 'parent: #A07850  couple: #C49060\nnode rings: #9B8A6A  canvas: #c8d898',
    ct: '#f3f7ee', cb: '#c8d898', wr: '#705020', wi: 0.09,
    nf: '#ffffff', ns: '#9B8A6A',  // warm brown rings
    ff: '#d6f2e0', fb: '#2e9966', ft: '#15623d',
    nt: '#444441', st: '#A89878',
    pl: '#A07850',   // warm brown parent curves
    cl: '#C49060',   // caramel couple arcs
    ax: '#BCA888',
    swatches: [
      { c: '#f3f7ee', l: 'canvas top' },
      { c: '#c8d898', l: 'canvas btm' },
      { c: '#A07850', l: 'parent ←' },
      { c: '#C49060', l: 'couple ←' },
    ]
  },
  {
    name: 'Golden Canopy',
    num: 'Variation 05',
    desc: 'Most shifted — canvas goes golden-green, connectors are rich brown, focus node warms from mint to ivory. Print-worthy feel.',
    change: 'canvas: #f5f6e8 → #ccd080  branches: #8B7048\nfocus fill → #F0E8D8  focus border → #7B6B4A',
    ct: '#f5f6e8', cb: '#ccd080', wr: '#8B5020', wi: 0.13,
    nf: '#ffffff', ns: '#9B8A6A',
    ff: '#F0E8D8', fb: '#7B6B4A', ft: '#3A2E1E',  // warm ivory focus
    nt: '#444441', st: '#A89060',
    pl: '#8B7048',   // rich brown parent curves
    cl: '#C49060',   // caramel couple arcs
    ax: '#B8A070',
    swatches: [
      { c: '#f5f6e8', l: 'canvas top' },
      { c: '#ccd080', l: 'canvas btm' },
      { c: '#8B7048', l: 'branch ←' },
      { c: '#F0E8D8', l: 'focus ←' },
    ]
  },
];

// ── SVG layout constants ───────────────────────────────────────────────────
const W = 330, H = 258;
const axX = 36;
const g1y = 52, fcy = 147, g3y = 224;
const r1 = 15, rf = 22, rs = 15, rc = 13;

const MR = [88, g1y], ER = [146, g1y], EL = [198, g1y], SS = [256, g1y];
const DR = [138, fcy], LR = [213, fcy];
const EZ = [104, g3y], WK = [171, g3y];

const lgMid = (MR[0] + ER[0]) / 2;  // 117
const rgMid = (EL[0] + SS[0]) / 2;  // 227
const coMid = (DR[0] + LR[0]) / 2;  // 175.5

// Cubic bezier — smooth S-curve between any two points
function cb(x1, y1, x2, y2, col, sw, extra) {
  const my = (y1 + y2) / 2;
  return `<path d="M ${x1},${y1} C ${x1},${my} ${x2},${my} ${x2},${y2}"
    fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"${extra||''}/>`;
}

// Quadratic bezier — gentle upward arc for couple lines
function qa(x1, y, x2, col, sw) {
  const mid = (x1 + x2) / 2;
  const bow = (x2 - x1) * 0.18;  // bow height scales with length
  return `<path d="M ${x1},${y} Q ${mid},${y - bow} ${x2},${y}"
    fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;
}

function node(cx, cy, r, nf, ns, sw, init, year, nt, st) {
  return `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${nf}" stroke="${ns}" stroke-width="${sw}"/>
    <text x="${cx}" y="${cy+3.5}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${nt}" font-family="Georgia,serif">${init}</text>
    <text x="${cx}" y="${cy+r+9}" text-anchor="middle" font-size="6" fill="${st}" font-family="Georgia,serif">${year}</text>`;
}

function buildSVG(p, idx) {
  const bgId = `bg${idx}`, gr1 = `gr1${idx}`, gr2 = `gr2${idx}`, wrId = `wr${idx}`;

  const defs = `<defs>
    <linearGradient id="${bgId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${p.ct}"/>
      <stop offset="100%" stop-color="${p.cb}"/>
    </linearGradient>
    <radialGradient id="${gr1}" cx="15%" cy="28%" r="50%">
      <stop offset="0%" stop-color="rgba(93,202,165,0.16)"/>
      <stop offset="100%" stop-color="rgba(93,202,165,0)"/>
    </radialGradient>
    <radialGradient id="${gr2}" cx="82%" cy="70%" r="44%">
      <stop offset="0%" stop-color="rgba(29,158,117,0.09)"/>
      <stop offset="100%" stop-color="rgba(29,158,117,0)"/>
    </radialGradient>
    <radialGradient id="${wrId}" cx="50%" cy="92%" r="65%">
      <stop offset="0%" stop-color="${p.wr}" stop-opacity="${p.wi}"/>
      <stop offset="100%" stop-color="${p.wr}" stop-opacity="0"/>
    </radialGradient>
  </defs>`;

  const canvas = `
    <rect width="${W}" height="${H}" fill="url(#${bgId})"/>
    <rect width="${W}" height="${H}" fill="url(#${gr1})"/>
    <rect width="${W}" height="${H}" fill="url(#${gr2})"/>
    <rect width="${W}" height="${H}" fill="url(#${wrId})"/>`;

  const timeline = `
    <line x1="${axX}" y1="36" x2="${axX}" y2="${H-10}" stroke="${p.ax}" stroke-width="0.4" opacity="0.55"/>
    <line x1="${axX-3}" y1="${g1y}" x2="${axX+3}" y2="${g1y}" stroke="${p.ax}" stroke-width="0.5"/>
    <line x1="${axX-3}" y1="${fcy}" x2="${axX+3}" y2="${fcy}" stroke="${p.ax}" stroke-width="0.5"/>
    <line x1="${axX-3}" y1="${g3y}" x2="${axX+3}" y2="${g3y}" stroke="${p.ax}" stroke-width="0.5"/>
    <text x="${axX-5}" y="${g1y+2.5}" text-anchor="end" font-size="6" fill="${p.ax}" font-family="Georgia,serif">1940</text>
    <text x="${axX-5}" y="${fcy+2.5}" text-anchor="end" font-size="6" fill="${p.ax}" font-family="Georgia,serif">1975</text>
    <text x="${axX-5}" y="${g3y+2.5}" text-anchor="end" font-size="6" fill="${p.ax}" font-family="Georgia,serif">2010</text>`;

  // Couple arcs (upward bow)
  const lgCouple = qa(MR[0]+r1, g1y, ER[0]-r1, p.cl, 0.9);
  const rgCouple = qa(EL[0]+r1, g1y, SS[0]-r1, p.cl, 0.9);
  const drCouple = qa(DR[0]+rf, fcy, LR[0]-rs, fcy, p.cl, 0.9);

  // Hearts on couple arcs
  const lgHeart = `<text x="${lgMid}" y="${g1y-1}" text-anchor="middle" font-size="6.5" fill="${p.cl}">♥</text>`;
  const rgHeart = `<text x="${rgMid}" y="${g1y-1}" text-anchor="middle" font-size="6.5" fill="${p.cl}">♥</text>`;
  const drHeart = `<text x="${coMid}" y="${fcy-3}" text-anchor="middle" font-size="6.5" fill="${p.cl}">♥</text>`;

  // Bezier curves: grandparents → parents (S-curve sweeping down and across)
  const lgToFocus = cb(lgMid, g1y+r1, DR[0], fcy-rf, p.pl, 1.1);
  const rgToSpouse = cb(rgMid, g1y+r1, LR[0], fcy-rs, p.pl, 1.1);

  // Bezier curves: DR → children (fan outward)
  const drToEZ = cb(DR[0], fcy+rf, EZ[0], g3y-rc, p.pl, 1.0);
  const drToWK = cb(DR[0], fcy+rf, WK[0], g3y-rc, p.pl, 1.0);

  const connectors = `
    <!-- Couple arcs -->
    ${lgCouple}${lgHeart}
    ${rgCouple}${rgHeart}
    ${drCouple}${drHeart}
    <!-- Branch curves: grandparents → focus generation -->
    ${lgToFocus}
    ${rgToSpouse}
    <!-- Branch curves: DR → children -->
    ${drToEZ}
    ${drToWK}`;

  const nodes = `
    ${node(MR[0], g1y, r1, p.nf, p.ns, 0.9, 'MR', '1948', p.nt, p.st)}
    ${node(ER[0], g1y, r1, p.nf, p.ns, 0.9, 'ER', '1950', p.nt, p.st)}
    ${node(EL[0], g1y, r1, p.nf, p.ns, 0.9, 'EL', '1948', p.nt, p.st)}
    ${node(SS[0], g1y, r1, p.nf, p.ns, 0.9, 'SS', '1950', p.nt, p.st)}
    <circle cx="${DR[0]}" cy="${fcy}" r="${rf}" fill="${p.ff}" stroke="${p.fb}" stroke-width="2.2"/>
    <text x="${DR[0]}" y="${fcy+4}" text-anchor="middle" font-size="10" font-weight="700" fill="${p.ft}" font-family="Georgia,serif">DR</text>
    ${node(LR[0], fcy, rs, p.nf, p.ns, 0.9, 'LR', '1981', p.nt, p.st)}
    ${node(EZ[0], g3y, rc, p.nf, p.ns, 0.8, 'EZ', '2019', p.nt, p.st)}
    ${node(WK[0], g3y, rc, p.nf, p.ns, 0.8, 'WK', '2016', p.nt, p.st)}`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  ${defs}${canvas}${timeline}${connectors}${nodes}
</svg>`;
}

function buildCard(p, idx) {
  const changeLines = p.change.split('\n').map(l => `<div>${l}</div>`).join('');
  const swHtml = p.swatches.map(s => `
    <div class="sw" style="background:${s.c}">
      <div class="tip"><span>${s.l}</span><span>${s.c}</span></div>
    </div>`).join('');

  return `<div class="card">
    <div class="card-header">
      <div class="card-num">${p.num}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-desc">${p.desc}</div>
      <div class="card-change">${changeLines}</div>
    </div>
    <div class="preview">${buildSVG(p, idx)}</div>
    <div class="swatches">${swHtml}</div>
  </div>`;
}

const grid = document.getElementById('grid');
CARDS.forEach((p, i) => {
  const wrap = document.createElement('div');
  wrap.innerHTML = buildCard(p, i);
  grid.appendChild(wrap.firstElementChild);
});
</script>
</body>
</html>
