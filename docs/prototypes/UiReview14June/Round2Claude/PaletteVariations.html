<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArborKin — Palette Variations</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0C0B09;
    color: #D4CFC5;
    font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    min-height: 100vh;
    padding: 56px 32px 88px;
  }

  /* ── Header ─────────────────────── */
  header {
    text-align: center;
    margin-bottom: 52px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .brand-name {
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #5B8C5B;
    font-weight: 400;
  }

  h1 {
    font-size: clamp(1.7rem, 4.5vw, 2.9rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: #EDE8DE;
  }

  h1 em {
    font-style: italic;
    color: #87B87A;
  }

  .meta {
    margin-top: 10px;
    font-size: 0.72rem;
    color: #3E3B35;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .hairline {
    width: 64px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #2D4828, transparent);
    margin: 18px auto 0;
  }

  /* ── Grid ───────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1160px;
    margin: 0 auto;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .card:nth-child(5) { grid-column: auto; }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
  }

  @media (min-width: 861px) {
    .card:nth-child(5) { grid-column: 2; }
  }

  /* ── Card ───────────────────────── */
  .card {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.015);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    cursor: default;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }

  .card-header {
    padding: 14px 17px 11px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    background: rgba(0,0,0,0.2);
  }

  .card-num {
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #5B8C5B;
    margin-bottom: 2px;
  }

  .card-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: #EDE8DE;
    letter-spacing: 0.01em;
  }

  .card-desc {
    font-size: 0.68rem;
    font-style: italic;
    color: #524E47;
    margin-top: 4px;
    line-height: 1.5;
  }

  .preview {
    line-height: 0;
    overflow: hidden;
  }

  .preview svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ── Swatches ───────────────────── */
  .swatches {
    display: flex;
    height: 30px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .sw {
    flex: 1;
    position: relative;
    transition: flex 0.18s ease;
    overflow: hidden;
  }

  .sw:hover { flex: 1.6; }

  .sw .tip {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
    gap: 1px;
  }

  .sw:hover .tip { opacity: 1; }

  .sw .tip-label {
    font-size: 5.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    mix-blend-mode: difference;
    color: white;
  }

  .sw .tip-hex {
    font-size: 6px;
    font-family: 'Courier New', monospace;
    mix-blend-mode: difference;
    color: white;
  }

  /* ── Footer ─────────────────────── */
  .footnote {
    text-align: center;
    margin-top: 52px;
    font-size: 0.68rem;
    color: #2A2822;
    font-style: italic;
    letter-spacing: 0.06em;
    line-height: 1.8;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <path d="M11 3v16M11 7.5 L7 12M11 7.5 L15 12M11 12 L8.5 15.5M11 12 L13.5 15.5"
            stroke="#5B8C5B" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">ArborKin</span>
  </div>
  <h1>Palette <em>Variations</em></h1>
  <p class="meta">Design review · June 2026 · Adding brown to the botanical palette</p>
  <div class="hairline"></div>
</header>

<main class="grid" id="grid"></main>

<p class="footnote">
  Current palette: ivory canvas · green connectors · white nodes · purple focus node<br>
  Each variation introduces brown at a different weight and location.<br>
  Hover a swatch to see the hex value.
</p>

<script>
const PALETTES = [
  {
    name: 'Bark Lines',
    num: 'Variation 01',
    desc: 'Only the connector lines shift to warm brown. Canvas and nodes stay clean ivory/white. Reads as tree branches, not decoration.',
    cb: '#fdfaf5', nf: '#ffffff', ns: '#888780',
    ff: '#534AB7', fb: '#534AB7', ft: '#ffffff',
    nt: '#444441', st: '#B4B2A9',
    pl: '#A0714F', cl: '#C4956A', ax: '#D3D1C7',
    swatches: [
      { c: '#fdfaf5', l: 'canvas' },
      { c: '#A0714F', l: 'branch' },
      { c: '#ffffff', l: 'node' },
      { c: '#534AB7', l: 'focus' },
    ]
  },
  {
    name: 'Parchment',
    num: 'Variation 02',
    desc: 'Canvas warms to aged parchment. Node borders and connectors go bark-brown. Feels like an heirloom document.',
    cb: '#F5ECD9', nf: '#FFFDF6', ns: '#A0714F',
    ff: '#534AB7', fb: '#534AB7', ft: '#ffffff',
    nt: '#3A2E22', st: '#A08060',
    pl: '#8B6347', cl: '#C4956A', ax: '#C4A882',
    swatches: [
      { c: '#F5ECD9', l: 'canvas' },
      { c: '#8B6347', l: 'branch' },
      { c: '#FFFDF6', l: 'node' },
      { c: '#534AB7', l: 'focus' },
    ]
  },
  {
    name: 'Grove',
    num: 'Variation 03',
    desc: 'Deep forest green canvas, cream nodes, warm caramel branches. The most dramatic shift — striking in dark environments.',
    cb: '#1A3D2B', nf: '#FAF5EC', ns: '#C4956A',
    ff: '#FAF5EC', fb: '#C4956A', ft: '#1A3D2B',
    nt: '#2A1E12', st: '#7DC9A5',
    pl: '#C4956A', cl: '#8B8C5A', ax: '#2D6B4A',
    swatches: [
      { c: '#1A3D2B', l: 'canvas' },
      { c: '#C4956A', l: 'branch' },
      { c: '#FAF5EC', l: 'node' },
      { c: '#C4956A', l: 'focus' },
    ]
  },
  {
    name: 'Bark & Leaf',
    num: 'Variation 04',
    desc: 'Ivory canvas stays, node borders go brown, parent lines are warm brown while couple lines stay sage green. Brown and green share equal weight.',
    cb: '#fdfaf5', nf: '#ffffff', ns: '#8B5E3C',
    ff: '#534AB7', fb: '#534AB7', ft: '#ffffff',
    nt: '#444441', st: '#8B7060',
    pl: '#A07850', cl: '#7AB898', ax: '#C4B4A4',
    swatches: [
      { c: '#fdfaf5', l: 'canvas' },
      { c: '#A07850', l: 'parent' },
      { c: '#7AB898', l: 'couple' },
      { c: '#8B5E3C', l: 'border' },
    ]
  },
  {
    name: 'Aged Oak',
    num: 'Variation 05',
    desc: 'Warm tan canvas, mahogany connectors, forest green focus node replacing the purple. Feels print-ready and premium.',
    cb: '#EDE5D8', nf: '#FFFDF8', ns: '#9B8470',
    ff: '#1B5E3B', fb: '#1B5E3B', ft: '#ffffff',
    nt: '#3A2E22', st: '#8B7060',
    pl: '#6B4226', cl: '#A08060', ax: '#C0AE98',
    swatches: [
      { c: '#EDE5D8', l: 'canvas' },
      { c: '#6B4226', l: 'branch' },
      { c: '#FFFDF8', l: 'node' },
      { c: '#1B5E3B', l: 'focus' },
    ]
  },
];

// ── Tree layout constants ────────────────────
const W = 330, H = 258;
const axX = 36;
const g1y = 52;   // grandparent generation y
const fcy = 147;  // focus generation y
const g3y = 224;  // children generation y
const r1 = 15;    // grandparent node radius
const rf = 22;    // focus node radius
const rs = 15;    // spouse node radius
const rc = 13;    // children node radius

// Node positions
const MR = [88,  g1y];
const ER = [146, g1y];
const EL = [198, g1y];
const SS = [256, g1y];
const DR = [138, fcy];
const LR = [213, fcy];
const EZ = [104, g3y];
const WK = [171, g3y];

// Connector midpoints
const lgMid = (MR[0] + ER[0]) / 2;  // 117
const rgMid = (EL[0] + SS[0]) / 2;  // 227
const coMid = (DR[0] + LR[0]) / 2;  // 175.5

function seg(x1,y1,x2,y2,col,sw) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;
}

function node(cx, cy, r, fill, stroke, sw, initials, year, textClr, stClr) {
  return `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
    <text x="${cx}" y="${cy+3.5}" text-anchor="middle" dominant-baseline="middle" dy="-0.5" font-size="8.5" font-weight="700" fill="${textClr}" font-family="Georgia,serif">${initials}</text>
    <text x="${cx}" y="${cy+r+9}" text-anchor="middle" font-size="6" fill="${stClr}" font-family="Georgia,serif">${year}</text>`;
}

function heart(x, y, col) {
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="7" fill="${col}" opacity="0.9">♥</text>`;
}

function buildSVG(p) {
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">

  <!-- Canvas -->
  <rect width="${W}" height="${H}" fill="${p.cb}"/>

  <!-- Timeline axis -->
  <line x1="${axX}" y1="36" x2="${axX}" y2="${H-10}" stroke="${p.ax}" stroke-width="0.4" opacity="0.7"/>
  <line x1="${axX-3}" y1="${g1y}" x2="${axX+3}" y2="${g1y}" stroke="${p.ax}" stroke-width="0.5"/>
  <line x1="${axX-3}" y1="${fcy}"  x2="${axX+3}" y2="${fcy}"  stroke="${p.ax}" stroke-width="0.5"/>
  <line x1="${axX-3}" y1="${g3y}" x2="${axX+3}" y2="${g3y}" stroke="${p.ax}" stroke-width="0.5"/>
  <text x="${axX-5}" y="${g1y+2.5}" text-anchor="end" font-size="6" fill="${p.ax}" font-family="Georgia,serif">1940</text>
  <text x="${axX-5}" y="${fcy+2.5}"  text-anchor="end" font-size="6" fill="${p.ax}" font-family="Georgia,serif">1975</text>
  <text x="${axX-5}" y="${g3y+2.5}" text-anchor="end" font-size="6" fill="${p.ax}" font-family="Georgia,serif">2010</text>

  <!-- ── Connectors ── -->

  <!-- Left grandparent couple -->
  ${seg(MR[0]+r1, g1y, ER[0]-r1, g1y, p.cl, 0.7)}
  ${heart(lgMid, g1y+3, p.cl)}

  <!-- Right grandparent couple -->
  ${seg(EL[0]+r1, g1y, SS[0]-r1, g1y, p.cl, 0.7)}
  ${heart(rgMid, g1y+3, p.cl)}

  <!-- Left grandparents → DR (orthogonal) -->
  ${seg(lgMid, g1y+r1, lgMid, 100, p.pl, 0.9)}
  ${seg(lgMid, 100, DR[0], 100, p.pl, 0.9)}
  ${seg(DR[0], 100, DR[0], fcy-rf, p.pl, 0.9)}

  <!-- Right grandparents → LR (orthogonal) -->
  ${seg(rgMid, g1y+r1, rgMid, 100, p.pl, 0.9)}
  ${seg(rgMid, 100, LR[0], 100, p.pl, 0.9)}
  ${seg(LR[0], 100, LR[0], fcy-rs, p.pl, 0.9)}

  <!-- DR-LR couple -->
  ${seg(DR[0]+rf, fcy, LR[0]-rs, fcy, p.cl, 0.7)}
  ${heart(coMid, fcy+3, p.cl)}

  <!-- DR → children (spread from DR bottom) -->
  ${seg(DR[0], fcy+rf, DR[0], 190, p.pl, 0.9)}
  ${seg(EZ[0], 190, WK[0], 190, p.pl, 0.9)}
  ${seg(EZ[0], 190, EZ[0], g3y-rc, p.pl, 0.9)}
  ${seg(WK[0], 190, WK[0], g3y-rc, p.pl, 0.9)}

  <!-- ── Nodes ── -->

  <!-- Grandparents -->
  ${node(MR[0], g1y, r1, p.nf, p.ns, 0.9, 'MR', '1948', p.nt, p.st)}
  ${node(ER[0], g1y, r1, p.nf, p.ns, 0.9, 'ER', '1950', p.nt, p.st)}
  ${node(EL[0], g1y, r1, p.nf, p.ns, 0.9, 'EL', '1948', p.nt, p.st)}
  ${node(SS[0], g1y, r1, p.nf, p.ns, 0.9, 'SS', '1950', p.nt, p.st)}

  <!-- Focus (DR) -->
  <circle cx="${DR[0]}" cy="${fcy}" r="${rf}" fill="${p.ff}" stroke="${p.fb}" stroke-width="2.2"/>
  <text x="${DR[0]}" y="${fcy+4}" text-anchor="middle" font-size="10" font-weight="700" fill="${p.ft}" font-family="Georgia,serif">DR</text>

  <!-- Spouse (LR) -->
  ${node(LR[0], fcy, rs, p.nf, p.ns, 0.9, 'LR', '1981', p.nt, p.st)}

  <!-- Children -->
  ${node(EZ[0], g3y, rc, p.nf, p.ns, 0.8, 'EZ', '2019', p.nt, p.st)}
  ${node(WK[0], g3y, rc, p.nf, p.ns, 0.8, 'WK', '2016', p.nt, p.st)}

</svg>`;
}

function buildCard(p) {
  const swHtml = p.swatches.map(s => `
    <div class="sw" style="background:${s.c}">
      <div class="tip">
        <span class="tip-label">${s.l}</span>
        <span class="tip-hex">${s.c}</span>
      </div>
    </div>`).join('');

  return `<div class="card">
    <div class="card-header">
      <div class="card-num">${p.num}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-desc">${p.desc}</div>
    </div>
    <div class="preview">${buildSVG(p)}</div>
    <div class="swatches">${swHtml}</div>
  </div>`;
}

const grid = document.getElementById('grid');
PALETTES.forEach(p => {
  const wrap = document.createElement('div');
  wrap.innerHTML = buildCard(p);
  grid.appendChild(wrap.firstElementChild);
});
</script>
</body>
</html>
