name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/FamilyTree.Core/**'
      - 'src/FamilyTree.Shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/FamilyTree.Core/FamilyTree.Core.csproj

      - name: Build
        run: dotnet build src/FamilyTree.Core/FamilyTree.Core.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/FamilyTree.Core.Tests/FamilyTree.Core.Tests.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/FamilyTree.Core/FamilyTree.Core.csproj -c Release -o publish/api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: publish/api
