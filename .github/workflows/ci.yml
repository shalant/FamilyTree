name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FamilyTree.sln

      - name: Build Debug
        run: dotnet build FamilyTree.sln --no-restore -c Debug

      - name: Build Release
        run: dotnet build FamilyTree.sln --no-restore -c Release

      # Excludes FamilyTree.E2E.Tests deliberately — that project needs the SQL Server
      # container + Playwright browsers set up below, and fails loudly (not a soft
      # skip — see E2eTestBase) if it runs without them.
      - name: Test
        run: |
          dotnet test tests/FamilyTree.Core.Tests/FamilyTree.Core.Tests.csproj --no-build -c Release --logger "trx;LogFileName=core_test_results.trx"
          dotnet test tests/FamilyTree.Web.Tests/FamilyTree.Web.Tests.csproj --no-build -c Release --logger "trx;LogFileName=web_test_results.trx"

      # Informational only — the full suite above already gates the build. This just
      # makes regression coverage easy to eyeball separately in CI logs: tests tagged
      # [Trait("Category","Regression")] protect a specific bug that shipped and was
      # found live, so a failure here is a real user-facing behavior breaking again.
      - name: Regression tests (informational)
        if: always()
        run: dotnet test tests/FamilyTree.Web.Tests/FamilyTree.Web.Tests.csproj --no-build -c Release --filter "Category=Regression" --logger "console;verbosity=detailed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real, disposable SQL Server instance — not SQLite/InMemory. Person/Relationship
    # use SQL Server's RowVersion for optimistic concurrency, which SQLite doesn't
    # support natively; swapping providers for CI speed would silently stop testing
    # that behavior. The SA password is throwaway (this container never holds real
    # data and is destroyed at the end of the job) but pulled from a repo secret
    # rather than hardcoded, so it doesn't sit in the diff as a flagged plaintext
    # credential on every PR that touches this file.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.E2E_SA_PASSWORD }}
        ports:
          - 1433:1433
        # `options` can't read the secrets context directly (GitHub restricts it to
        # env/github/needs/strategy/matrix) — $MSSQL_SA_PASSWORD is expanded by the
        # container's own shell when the health check runs, not by the runner, so
        # the secret still never appears in the workflow file itself.
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FamilyTree.sln

      # E2eAppFixture launches the real built FamilyTree.Web.dll as an external process
      # (not WebApplicationFactory/TestServer) — needs the actual build output to exist
      # at the same configuration the test assembly itself is built with.
      - name: Build Release
        run: dotnet build FamilyTree.sln --no-restore -c Release

      # The Microsoft.Playwright package generates this script into its own project's
      # build output — using it (rather than a separately-installed global CLI tool)
      # guarantees the installed browser version always matches the package version
      # actually referenced, with no separate version to keep in sync.
      - name: Install Playwright browsers
        run: pwsh tests/FamilyTree.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E Test
        env:
          E2E_ConnectionString: "Server=localhost,1433;Database=FamilyTreeDb_E2E;User Id=sa;Password=${{ secrets.E2E_SA_PASSWORD }};TrustServerCertificate=True"
        run: dotnet test tests/FamilyTree.E2E.Tests/FamilyTree.E2E.Tests.csproj --no-build -c Release --logger "trx;LogFileName=e2e_test_results.trx" --logger "console;verbosity=detailed"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: '**/*.trx'
