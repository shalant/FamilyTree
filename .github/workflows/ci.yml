name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FamilyTree.sln

      - name: Build Debug
        run: dotnet build FamilyTree.sln --no-restore -c Debug

      - name: Build Release
        run: dotnet build FamilyTree.sln --no-restore -c Release

      - name: Test
        run: dotnet test FamilyTree.sln --no-build -c Release --logger "trx;LogFileName=test_results.trx"

      # Informational only — the full suite above already gates the build. This just
      # makes regression coverage easy to eyeball separately in CI logs: tests tagged
      # [Trait("Category","Regression")] protect a specific bug that shipped and was
      # found live, so a failure here is a real user-facing behavior breaking again.
      - name: Regression tests (informational)
        if: always()
        run: dotnet test FamilyTree.sln --no-build -c Release --filter "Category=Regression" --logger "console;verbosity=detailed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
